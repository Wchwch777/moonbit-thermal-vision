name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    name: MoonBit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MoonBit on Unix
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Setup MoonBit on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "$HOME/.moon/bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Toolchain
        run: moon version --all

      - name: Format
        run: moon fmt --check

      - name: Check
        run: moon check --deny-warn

      - name: Interface info
        run: moon info --deny-warn

      - name: Ensure generated interfaces are committed
        run: git diff --exit-code

      - name: Test
        run: moon test --deny-warn
